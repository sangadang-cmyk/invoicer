name: Deployment to Amazon ECS

on:
  push:
    tags:
      - 'dev-*'
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
        
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Build Frontend
        run: pnpm build
        
      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/main/resources/static/
  
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
       
#      ENABLE THIS WHEN PERFORMANCE IS TOO BAD. CURRENTLY, WHEN CACHING IS ENABLED, IT INCREASES TIME BY 50%????  
#      
#      - name: Download cached docker images
#        id: download-docker-cache
#        uses: actions/cache@v4
#        with:
#          path: '/tmp/test/docker-images'
#          key: ${{ runner.os }}-docker-${{ hashFiles('**/pom.xml') }}
#          restore-keys: ${{ runner.os }}-docker-
#      
#      - name: Load cached docker images to docker
#        if: steps.download-docker-cache.outputs.cache-hit == 'true'
#        run: |
#          echo "Loading cached docker images..."
#          docker load -i /tmp/test/docker-images/docker-images.tar || echo "No cached docker images to load."

      - name: Run Tests
        run: |
          chmod +x ./mvnw
          ./mvnw test
          
#      - name: Update cache with new docker images
#        if: steps.download-docker-cache.outputs.cache-hit != 'true'
#        run: |
#          mkdir -p /tmp/test/docker-images
#          # Filter for actual images to avoid saving 'none' or intermediate layers
#          docker save $(docker images -q) -o /tmp/test/docker-images/docker-images.tar

      - name: Explicit Cache Save
        if: steps.download-docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/test/docker-images
          key: ${{ steps.download-docker-cache.outputs.cache-primary-key }}

  upload-image:
    name: Upload Docker Image to ECR
    runs-on: ubuntu-latest
    environment: production
    needs: test

    permissions:
      id-token: write
      contents: read

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/main/resources/static/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@62f4f872db3836360b72999f4b87f1ff13310f3a

      - name: Build and push image to Amazon ECR
        id: build-image
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          FULL_IMAGE_NAME: ${{ steps.login-ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          chmod +x ./mvnw
          echo "::group::Maven Build & Dockerize to image: $FULL_IMAGE_NAME"
          ./mvnw spring-boot:build-image \
            -ntp \
            -Dspring-boot.build-image.imageName=$FULL_IMAGE_NAME \
            -DskipTests=true
          echo "::endgroup::"
          docker push $FULL_IMAGE_NAME
          echo "image=$FULL_IMAGE_NAME" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    environment: production
    needs: upload-image
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fill in the new image ID in the AWS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
        with:
          task-definition: task-definition.json
          container-name: Main
          image: ${{ needs.upload-image.outputs.image }}

      - name: Deploy AWS ECS with task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
