name: Deployment to Amazon ECS

on:
  push:
    tags:
      - 'dev-*'
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm build

      - name: Upload Frontend Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/main/resources/static/
  
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          chmod +x ./mvnw
          ./mvnw test
      
      # 2>&1 means redirect stderr (file descriptor 2) to stdout (file descriptor 1), so both standard output and error messages are captured.
      - name: Capture Docker logs
        if: failure()
        run: |
          mkdir -p logs
          for container in $(docker ps -aq); do
            docker logs $container > "logs/container-${container}.txt" 2>&1
          done
          docker ps -a > logs/containers-list.txt

      - name: Upload LocalStack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: localstack-logs
          path: |
            **/target/surefire-reports/
            **/*.log
            logs/

  package-hurl:
    name: Zip Hurl tests and upload to S3
    runs-on: ubuntu-latest
    environment: production
    needs: test
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check hurl files exist
        run: |
          if [ ! -d "src/test/resources/hurl" ] || [ -z "$(ls -A src/test/resources/hurl/*.hurl 2>/dev/null)" ]; then
            echo "No hurl files found"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync src/test/resources/hurl s3://${{ vars.HURL_S3_BUCKET }}/ \
            --delete \
            --exact-timestamps

  upload-image:
    name: Upload Docker Image to ECR
    runs-on: ubuntu-latest
    environment: production
    needs: [ test, build-frontend, package-hurl ]

    permissions:
      id-token: write
      contents: read

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/main/resources/static/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@62f4f872db3836360b72999f4b87f1ff13310f3a

      - name: Update version in application.yml
        run: |
          echo "Updating deployment version in application.yml"
          sed -i "s/deployment-version: .*/deployment-version: ${GITHUB_REF_NAME}/" src/main/resources/application.yml

      - name: Build and push image to Amazon ECR
        id: build-image
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
          FULL_IMAGE_NAME: ${{ steps.login-ecr.outputs.registry }}/${{ vars.AWS_ECR_REPOSITORY }}:${{ github.ref_name }}
          DEPLOYMENT_VERSION: ${{ github.ref_name }}
          OIDC_ISSUER_URI: ${{ vars.OIDC_ISSUER_URI }}
        run: |
          chmod +x ./mvnw
          echo "::group::Maven Build & Dockerize to image: $FULL_IMAGE_NAME"
          ./mvnw spring-boot:build-image \
            -ntp \
            -Dspring-boot.build-image.imageName=$FULL_IMAGE_NAME \
            -DskipTests=true
          echo "::endgroup::"
          docker push $FULL_IMAGE_NAME
          echo "image=$FULL_IMAGE_NAME" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    environment: production
    needs: upload-image
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fill in the new image ID in the AWS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd57f713b6c079302a4c01db7017a36fc
        with:
          task-definition: task-definition.json
          container-name: Main
          image: ${{ needs.upload-image.outputs.image }}

      - name: Deploy AWS ECS with task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f169e64a0e60233aacca83799a
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: false

      - name: Wait for service stability 
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
              --cluster ${{ vars.ECS_CLUSTER }} \
              --services ${{ vars.ECS_SERVICE }}
          echo "ECS service is stable now."
          
      - name: Fetch ECS lambda logs
        run: |
          mkdir -p lambda-logs
          
          echo "::group::Lambda Log Stream: Test Transfer"
          aws logs describe-log-streams \
            --log-group-name "/aws/lambda/Invoicer-ECS-HandlePostTestTransfer" \
            --order-by "LastEventTime" \
            --descending \
            --max-items 1 > tee lambda-logs/test-transfer-log.json
          echo "::endgroup::"
          
          echo "::group::Lambda Log Stream: Production Transfer"
          aws logs describe-log-streams \
            --log-group-name "/aws/lambda/Invoicer-ECS-HandlePostProductionTransfer" \
            --order-by "LastEventTime" \
            --descending \
            --max-items 1 > tee lambda-logs/production-transfer-log.json
          echo "::endgroup::"
          
      - name: Upload ECS lambda logs
        uses: actions/upload-artifact@v4
        with:
          name: lambda-log-streams
          path: lambda-logs/
          retention-days: 7

      - name: Check deployment status. Fail if rollback
        run: |
          FINAL_STATUS=$(aws ecs list-service-deployments \
            --service ${{ vars.ECS_SERVICE }} \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --max-results=1 \
            --query="serviceDeployments[0].status" \
            --output text)
          echo "Final deployment status: $FINAL_STATUS"
          if [ "$FINAL_STATUS" != "SUCCESSFUL" ]; then
              echo "Deployment failed or rolled back. Failing the job."
              exit 1
          fi
          
          