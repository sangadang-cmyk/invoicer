services:
  localstack:
    image: localstack/localstack-pro:latest
    container_name: aws_cloud
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - DEFAULT_REGION=ap-southeast-1
      - DEBUG=1
      - SERVICES=s3,cognito-idp,dynamodb
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - DISABLE_CORS_CHECKS=1
      - EXTRA_CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:3000
      - EXTRA_CORS_ALLOWED_HEADERS=authorization,content-type,x-requested-with
      - SNAPSHOT_SAVE_STRATEGY=ON_SHUTDOWN
    volumes:
      - localstack_data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack:/etc/localstack/init/ready.d"
volumes:
  localstack_data: