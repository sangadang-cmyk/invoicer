system:
  config:
    deployment-version: LOCAL
    auth-url: https://auth.sangdang.tech
    user-pool-id: ap-southeast-1_4OQTgCgSd

logging:
  level:
    tech.sangdang.invoicer.config.AwsCognitoAdapterConfig: trace

spring:
  application:
    name: invoicer
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:1704}
  web:
    error:
      include-message: always
  cloud:
    aws:
      region:
        static: ap-southeast-1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:https://placeholder.com}
management:
  endpoints:
    web:
      exposure:
        include: "*"
springdoc:
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
    filter: true
    display-request-duration: on
    syntax-highlight:
      activated: true
      theme: obsidian
    doc-expansion: none
  api-docs:
    enabled: true
aws:
  s3:
    bucket-name: invoicer-inbound
    default-presigned-upload-ttl-mins: 10