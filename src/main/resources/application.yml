spring:
  application:
    name: invoicer
  cloud:
    aws:
      region:
        static: ap-southeast-1
management:
  endpoints:
    web:
      exposure:
        include: "*"
springdoc:
  swagger-ui:
    enabled: true
aws:
  s3:
    bucket-name: my-invoicer-bucket
    default-presigned-upload-ttl-mins: 10