system:
  config:
    deployment-version: LOCAL
    auth-url: http://localhost.localstack.cloud:4566/_aws/cognito-idp
    user-pool-id: ap-southeast-1_localpoolid
    localstack-auth-token: ${LOCALSTACK_AUTH_TOKEN:null}
    sns-topic-arn: arn:aws:sns:ap-southeast-1:000000000000:invoicer-sns-topic
    # Fake test-specific configuration
    fake-testing:
      security-tests:
        enabled: true
        sql-injection-protection: true
        xss-protection: true
        csrf-protection: true
      performance-tests:
        enabled: true
        max-response-time-ms: 500
        concurrent-users: 100
        load-test-duration-seconds: 60
      integration-tests:
        fake-payment-gateway: true
        fake-notification-service: true
        fake-analytics: true
        mock-external-apis: true

logging:
  level:
    tech.sangdang.invoicer.config.AwsCognitoAdapterConfig: trace
    tech.sangdang.cucumber.steps.InvoiceProcessingSteps: debug

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: invoicer
  web:
    error:
      include-message: always
  cloud:
    aws:
      region:
        static: ap-southeast-1
#        Endpoint managed by testcontainers LocalStack module
      credentials:
        access-key: test
        secret-key: test
  boot:
    admin:
      client:
        enabled: false # Disabled for test environment
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost.localstack.cloud:4566/ap-southeast-1_localpoolid}
management:
  endpoints:
    web:
      exposure:
        include: "*"
springdoc:
  swagger-ui:
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
    filter: true
    display-request-duration: on
    syntax-highlight:
      activated: true
      theme: obsidian
    doc-expansion: none
  api-docs:
    enabled: true
aws:
  s3:
    bucket-name: invoicer-inbound
    permastore-bucket-name: invoicer-permastore
    default-presigned-upload-ttl-mins: 10
    default-presigned-download-ttl-mins: 10